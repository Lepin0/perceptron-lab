[project]
name = "perceptron-lab"
version = "0.1.0"
description = "Single-layer perceptron written from scratch (lab work 1, Python 2026)"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.8"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["."]

[tool.mypy]
strict = true
mypy_path = "."
files = ["perceptron.py", "datasets.py", "plots.py", "tests"]